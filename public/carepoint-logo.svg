<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="cpTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#065F5B"/>
    </linearGradient>
    <linearGradient id="cpSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#065F5B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g filter="url(#softGlow)">
    <!-- Base Shape: Rounded Organic Shield/Heart Container -->
    <rect x="6" y="8" width="48" height="48" rx="16" fill="url(#cpTealGrad)"/>
    
    <!-- Overlapping Supportive Curve (Care) -->
    <path d="M22 36C22 28.5 28 23 35 23C40 23 43 26 43 30C43 37 32 44 26 46C23.5 44 22 40 22 36Z" fill="#FFFFFF" fill-opacity="0.25"/>
    
    <!-- Heart & Arms Outline -->
    <path d="M30 42C30 42 22 37 20 31.5C18 26 21 21 26 21C29 21 31.5 23 33 25C34.5 23 37 21 40 21C45 21 48 26 46 31.5C44 37 36 42 36 42" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Golden Focal Point (Point) -->
    <circle cx="33" cy="31" r="4.5" fill="url(#cpSunGrad)"/>
    <circle cx="33" cy="31" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Typography Wordmark -->
  <text x="66" y="33" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="23" font-weight="800" fill="#0F2F2D" letter-spacing="-0.03em">
    Care<tspan fill="#0D9488">Point</tspan>
  </text>
  
  <text x="67" y="47" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#64748B" letter-spacing="0.16em">
    SUPPORT SERVICES · NDIS
  </text>
</svg>
